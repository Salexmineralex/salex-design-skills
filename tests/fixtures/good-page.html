<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor Tide</title>
<style>
body{margin:0;font:16px/1.6 Georgia,serif;color:#12304a;background:#f6efe3}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px}
.menu-btn{display:none;min-height:44px;min-width:44px;background:#f6efe3;color:#12304a;border:1px solid #12304a}
nav a{display:inline-block;padding:12px 8px;color:#12304a}
.logo img{height:32px;display:block}
main{padding:24px;max-width:640px}
h1{font-size:40px;line-height:1.2;margin:0 0 16px}

.btn{display:inline-block;background:#c8412b;color:#fff;padding:12px 24px;text-decoration:none;border-right:2px solid #d9cdb6}

<header><a class="logo" href="/"><img src="brand-logo.svg" alt="Harbor Tide logo"></a><nav aria-label="Main"><a href="#">Tide tables</a></nav><button class="menu-btn" aria-label="Menu">Menu</button></header>
<main><h1>Tide tables for working harbors</h1><p>Daily tide times for 340 ports, checked by harbor masters.</p>
<a class="btn" href="#">See today's tides</a><img class="photo" src="brand-photo.svg" alt="A harbor at low tide"><p class="small">Updated every morning at six.</p></main>
</body></html>
