<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Layers</title>
<style>
body{margin:0;font-family:Georgia,serif;color:#12304a;background:#f6efe3}
.card{position:relative;padding:32px;width:480px;height:240px;overflow:hidden}
.glow{position:absolute;inset:0;background:linear-gradient(135deg,#7c3aed,#f6efe3)}
.edge{position:absolute;inset:0;border:1px solid #12304a;border-radius:8px}
.text{position:relative}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px}
.tile{border-radius:12px;background:#fff;padding:12px}
</style></head><body>
<div class="card"><div class="glow"></div><div class="edge"></div><div class="text"><h1>Tide tables</h1><p>Daily times for 340 ports.</p></div></div>
<div class="grid">
<div class="tile"><svg width="140" height="90" viewBox="0 0 140 90"><rect width="140" height="90" fill="#12304a"/></svg><p>Harbor one</p></div>
<div class="tile"><svg width="140" height="90" viewBox="0 0 140 90"><rect width="140" height="90" fill="#c8412b"/></svg><p>Harbor two</p></div>
<div class="tile"><svg width="140" height="90" viewBox="0 0 140 90"><rect width="140" height="90" fill="#6b5f4c"/></svg><p>Harbor three</p></div>
</div>
</body></html>
