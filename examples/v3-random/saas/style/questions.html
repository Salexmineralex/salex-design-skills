<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Type characters — Overpedal</title>
  <style>
    body { margin: 0; background: #e7eef2; color: #102028; font: 16px/1.4 Helvetica, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 24px; }
    figure { margin: 0; padding: 16px; background: #f4f7f8; }
    figcaption { font-size: 14px; margin-top: 8px; }
    .edit { font: 700 40px/0.9 Georgia, serif; }
    .tech { font: 400 32px/1 "Helvetica Neue", Helvetica, sans-serif; }
    .warm { font: 400 36px/1 Palatino, Georgia, serif; }
    .loud { font: 700 44px/0.85 "Avenir Next Condensed", Avenir, sans-serif; text-transform: uppercase; }
    .picked { outline: 3px solid #0c3f4c; }
  </style>
</head>
<body>
  <main>
    <figure><p class="edit">Overpedal</p><figcaption>Editorial and serious. Costs the panel: the tank becomes a magazine.</figcaption></figure>
    <figure class="picked"><p class="tech">Overpedal</p><figcaption>Technical and precise. Chosen. Costs costume: the tile has to carry the place.</figcaption></figure>
    <figure><p class="warm">Overpedal</p><figcaption>Warm and handmade. Costs the figures: a book face softens a sour line.</figcaption></figure>
    <figure><p class="loud">Overpedal</p><figcaption>Loud and graphic. Costs the calm: the ground would have to shout with the type.</figcaption></figure>
  </main>
</body>
</html>
