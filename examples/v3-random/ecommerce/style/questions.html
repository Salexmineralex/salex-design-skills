<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Type characters — Cusp</title>
  <style>
    body { margin: 0; background: #14110e; color: #f3eee6; font: 16px/1.4 Helvetica, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 24px; }
    figure { margin: 0; padding: 16px; border: 3px solid #b7c0c8; }
    figcaption { font-size: 14px; color: #8a8178; margin-top: 8px; }
    .edit { font: 700 40px/0.9 "Didot", "Bodoni MT", Georgia, serif; }
    .tech { font: 400 32px/1 "Helvetica Neue", Helvetica, sans-serif; letter-spacing: 0; }
    .warm { font: 400 36px/1 Palatino, Georgia, serif; }
    .loud { font: 700 44px/0.85 "Avenir Next Condensed", Avenir, sans-serif; letter-spacing: -0.03em; text-transform: uppercase; }
    .picked { border-color: #ff5a1f; }
  </style>
</head>
<body>
  <main>
    <figure><p class="edit">Cusp</p><figcaption>Editorial and serious. Costs the torch: the plate becomes an essay.</figcaption></figure>
    <figure><p class="tech">Cusp</p><figcaption>Technical and precise. Costs the poster: the curve becomes a caption.</figcaption></figure>
    <figure><p class="warm">Cusp</p><figcaption>Warm and handmade. Costs the yard: the steel starts to look like a keepsake.</figcaption></figure>
    <figure class="picked"><p class="loud">Cusp</p><figcaption>Loud and graphic. Chosen. Costs long sentences: only the name can shout.</figcaption></figure>
  </main>
</body>
</html>
