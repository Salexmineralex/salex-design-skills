<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Over pictures</title>
<style>
body{margin:0;font:16px/1.5 Georgia,serif;color:#111;background:#fff}
section{padding:32px;margin:0 0 8px}
.pale{background:linear-gradient(90deg,#fff,#ffe9e0);color:#fff}
.deep{background:linear-gradient(90deg,#0b1a2b,#14304f);color:#fff}
.photo{background:#fff url('brand-photo.svg') center/cover;color:#f4f4f4}
.filled{background:linear-gradient(90deg,#c00,#00c);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head><body>
<section class="pale"><p class="pale-text">White words on a pale gradient, which nobody can read.</p></section>
<section class="deep"><p class="deep-text">White words on a deep gradient, which everybody can read.</p></section>
<h2 class="filled">Filled with a gradient</h2>
</body></html>
