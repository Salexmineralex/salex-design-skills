<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Type characters — Home rota</title>
  <style>
    body { margin: 0; background: #d7e6d4; color: #14241a; font: 16px/1.4 Palatino, Georgia, serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 24px; }
    figure { margin: 0; padding: 16px; background: #f6f1e6; }
    figcaption { font-size: 14px; margin-top: 8px; }
    .edit { font: 700 40px/0.9 Georgia, serif; }
    .tech { font: 400 32px/1 "Helvetica Neue", Helvetica, sans-serif; }
    .warm { font: 400 40px/1 Palatino, Georgia, serif; }
    .loud { font: 700 44px/0.85 "Avenir Next Condensed", Avenir, sans-serif; text-transform: uppercase; }
    .picked { outline: 3px solid #c45c12; }
  </style>
</head>
<body>
  <main>
    <figure><p class="edit">Home rota</p><figcaption>Editorial and serious. Costs the bench: the pens become an essay.</figcaption></figure>
    <figure><p class="tech">Home rota</p><figcaption>Technical and precise. Costs the animals: the rota becomes a dashboard.</figcaption></figure>
    <figure class="picked"><p class="warm">Home rota</p><figcaption>Warm and handmade. Chosen. Costs density: sentences have to stay short.</figcaption></figure>
    <figure><p class="loud">Home rota</p><figcaption>Loud and graphic. Costs the friend: poster type talks past a shared chore.</figcaption></figure>
  </main>
</body>
</html>
